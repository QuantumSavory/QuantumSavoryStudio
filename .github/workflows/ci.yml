name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-docs:
    name: Agent documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ./ci/agent-docs.sh

  backend-unit:
    name: Backend unit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
          save-always: "false"
      - run: ./ci/backend-unit.sh

  mcp-unit:
    name: MCP unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
          save-always: "false"
      - run: ./ci/mcp-unit.sh

  frontend-build:
    name: Frontend version and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: ./ci/frontend-build.sh

  http-contract:
    name: HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
          save-always: "false"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: ./ci/http-contract.sh

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
          save-always: "false"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: ./ci/backend-integration.sh
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-diagnostics
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Full Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
          save-always: "false"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: ./ci/browser.sh
        env:
          PLAYWRIGHT_INSTALL_SYSTEM_DEPS: "true"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  public-profile:
    name: Public profile (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
          save-always: "false"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: julia --startup-file=no ci/startup-smoke.jl

  startup-smoke:
    name: Host portability probe (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
          save-always: "false"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: julia --startup-file=no ci/startup-smoke.jl

  public-container:
    name: Public Podman profile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman
      - run: ./ci/public-container.sh

  browser-secondary:
    name: Browser portability probe (${{ matrix.engine }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        engine:
          - firefox
          - webkit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
          save-always: "false"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: ./ci/browser-secondary.sh "${{ matrix.engine }}"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ matrix.engine }}-diagnostics
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  browser-production:
    name: Integrated production browser
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: "false"
          save-always: "false"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: ./ci/browser-production.sh
        env:
          PLAYWRIGHT_INSTALL_SYSTEM_DEPS: "true"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-production-diagnostics
          path: ci-artifacts/
          if-no-files-found: ignore
          retention-days: 7
